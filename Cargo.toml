[package]
name = "ptchan-gateway"
version = "0.1.0"
edition = "2021"
description = "Socket.IO to webhook gateway for ptchan events"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
cookie_store = { version = "0.22", default-features = false }
hex = "0.4"
hmac = "0.12"
humantime = "2.1"
governor = { version = "0.10", default-features = false, features = ["std"] }
prometheus = { version = "0.14", features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
schemars = { version = "1.2", features = ["chrono04"] }
sha2 = "0.11"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.5", features = ["chrono"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
