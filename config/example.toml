[ptchan]
base_url = "https://ptchan.org"

[[integration]]
# Integration names become metric labels, origin names, and env var names.
# Use ASCII letters, digits, underscores, or hyphens.
name = "example"
# Every integration requires PTCHAN_INTEGRATION_EXAMPLE_SECRET.
# Empty means every board. Otherwise list allowed board names, e.g. ["test"].
# This applies to reading, webhook delivery, and posting.
allowed_boards = []

# Signed API rate limits for this integration.
# Buckets refill requests evenly over the window and allow short bursts.
[integration.rate_limit.reading]
requests = 120
window = "60s"
burst = 30

[integration.rate_limit.posting]
requests = 30
window = "60s"
burst = 5

# Enable signed thread reads by including this section.
# Omit the section to disable reading for this integration.
[integration.reading]

# Enable signed webhook delivery by including this section.
# Omit the section to disable webhooks for this integration.
# At least one webhook integration requires PTCHAN_SESSION_COOKIE.
[integration.webhook]
url = "http://127.0.0.1:8081/internal/ptchan/events"
# If true, also set PTCHAN_FINGERPRINT_SECRET.
include_poster_fingerprint = false

# Enable signed replies by including this section.
# Omit the section to disable posting for this integration.
[integration.posting]
# Posted name defaults to the integration name when display_name is omitted.
# ptchan allows at most 25 chars after adding any secure tripcode:
#   display_name + "##" + PTCHAN_INTEGRATION_EXAMPLE_TRIPCODE
display_name = "gw"
# Public !! tripcode emitted by ptchan for PTCHAN_INTEGRATION_EXAMPLE_TRIPCODE.
# Posting integrations must use unique secure tripcodes.
public_tripcode = "!!X8NXmAS44="
# Also set PTCHAN_INTEGRATION_EXAMPLE_POST_PASSWORD.

[runtime]
http_addr = "0.0.0.0:8080"

[runtime.rate_limit.reading]
requests = 1000
window = "60s"
burst = 200

[runtime.rate_limit.posting]
requests = 100
window = "60s"
burst = 20

[runtime.logging]
level = "info"
format = "json"

[storage]
# A non-empty SQLITE_PATH environment variable overrides this value.
sqlite_path = "data/ptchan-gateway.db"
event_retention = "14d"
